name: Integrity

# Contract: docs/contracts/deploy.md section 8. Public observations only; nothing here deploys or uses a secret.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity
  cancel-in-progress: false

jobs:
  integrity:
    name: Public site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (public configuration)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from packageManager)
        run: corepack enable

      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile

      - name: Check public invariants (pending launch targets warn)
        run: node scripts/integrity.ts
