name: CI

# Contract: docs/contracts/deploy.md. No secrets, no write permission, nothing here publishes an image
# (release.yml does, from a tag on main). Job names below are the required status checks; renaming one
# means updating the branch ruleset and docs/runbook/release.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (check, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from packageManager)
        run: corepack enable

      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Committed images carry no metadata (EXIF, XMP, IPTC, PNG text chunks)
        run: node scripts/check-image-metadata.ts

  build:
    name: Build and dist checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from packageManager)
        run: corepack enable

      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Scans over dist/ and the content sources (C-1, C-3, C-5, payment guard, /discord)
        run: node scripts/check-dist.ts

  image:
    name: Image checks and HTTP header test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: empirecommunity-site:ci
      CONTAINER: empirecommunity-site-ci
      RELAY_IMAGE: empirecommunity-relay:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm and install dependencies (scripts need the yaml package)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Compose template follows the deploy contract (labels, hardening, logging)
        run: |
          node scripts/check-compose.ts deploy/compose.yml
          docker compose -f deploy/compose.yml config -q

      - name: Relay compose template follows the deploy contract (exact labels, no mount, one public key equal to site.yaml)
        run: |
          node scripts/check-relay-compose.ts deploy/members-source/compose.yml
          docker compose -f deploy/members-source/compose.yml config -q

      - name: Build the image (the build runs the dist checks inside)
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t "$IMAGE" .

      - name: Image rules (no traefik label, non-root, 8080 only, no VOLUME, dist and nginx only)
        run: scripts/check-image.sh "$IMAGE"

      - name: Start the image with the production hardening
        run: |
          docker run -d --name "$CONTAINER" --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 32m --pids-limit 64 \
            -p 127.0.0.1:18080:8080 "$IMAGE"
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$CONTAINER"
          echo "::error::the container did not become healthy"
          exit 1

      - name: HTTP header test against the running image
        env:
          BASE_URL: http://127.0.0.1:18080
        run: node scripts/http-test.ts

      - name: No access log at the origin (D-20)
        run: |
          # The requests above were served; stdout and stderr must not hold a single access-log line.
          if docker logs "$CONTAINER" 2>&1 | grep -E '"(GET|HEAD|POST) /'; then
            echo "::error::the origin wrote an access log line"
            exit 1
          fi

      # The relay image exists once Forja's Dockerfile lands (B-WK1); release.yml refuses to publish without it.
      - name: Build the relay image
        if: hashFiles('deploy/members-source/Dockerfile') != ''
        run: docker build -t "$RELAY_IMAGE" -f deploy/members-source/Dockerfile deploy/members-source

      - name: Relay image rules (base by digest, no traefik label, non-root, 8080 only, no VOLUME, one added file)
        if: hashFiles('deploy/members-source/Dockerfile') != ''
        run: scripts/check-relay-image.sh "$RELAY_IMAGE"

      - name: Relay answers with the production hardening and no network (503, 404, 405, fixed headers, no access log)
        if: hashFiles('deploy/members-source/Dockerfile') != ''
        run: scripts/check-relay-run.sh "$RELAY_IMAGE"

      - name: Clean up
        if: always()
        run: |
          docker rm -f "$CONTAINER" || true
          docker image rm -f "$IMAGE" || true
          docker image rm -f "$RELAY_IMAGE" || true

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm and install dependencies (the hygiene check uses the yaml package)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Hygiene rules (SHA pins, permissions, no pull_request_target, no event data in shell)
        run: node scripts/check-workflows.ts

      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  verify-links:
    name: Verify external links
    # Network job (site-data sections 6 and 12): project URLs answer, linked repositories are public, the Discord invite
    # resolves to the configured server. No secret: the automatic token only raises the GitHub API rate limit (contents: read).
    # It depends on third-party sites, so it is not a required status check (docs/runbook/release.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm and install dependencies (the script uses the yaml package)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Links answer, repositories are public, the invite resolves
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-links.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks over the history
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact
