name: Release

# Release process: docs/runbook/release.md (D-24). A merge to main never builds. The owner tags vX.Y.Z on the merge
# commit after green CI; this workflow then guards the tag, publishes the image to GHCR, attests it and creates the
# GitHub Release. The host pulls by digest after verifying the attestation (docs/contracts/deploy.md section 6).
# Nothing here holds a credential for the host, and there is no secret: the run's own token is the only credential.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/empirecommunity/empirecommunitysite

jobs:
  verify:
    name: Release guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Tag format
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag outside vX.Y.Z or vX.Y.Z-rc.N; nothing is published."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[2]}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is annotated and its commit is on origin/main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::'$TAG' is a lightweight tag; releases use annotated tags (git tag -a)."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit of '$TAG' is not in origin/main."
            exit 1
          fi

      - name: CI succeeded on main for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --status success --json databaseId --jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "::error::No successful push CI run on main for $GITHUB_SHA. Wait for green CI, then re-tag."
            gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json databaseId,status,conclusion,event,headBranch || true
            exit 1
          fi
          echo "CI succeeded for $GITHUB_SHA ($count run(s))."

      - name: CHANGELOG has a dated, non-empty section (final releases) and the compose template names the version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # An rc is a rehearsal: it never reads the CHANGELOG, so it can never borrow the final version's notes.
          if [ "$PRERELEASE" = "true" ]; then
            echo "Release candidate: CHANGELOG and compose are not required."
            exit 0
          fi
          scripts/release-notes.sh "$VERSION" > /dev/null
          if ! grep -qE "^[[:space:]]+image: ${IMAGE}:${VERSION//./\\.}@sha256:" deploy/compose.yml; then
            echo "::error::deploy/compose.yml does not carry ${IMAGE}:${VERSION}; the release PR updates it."
            exit 1
          fi

  publish:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the run token
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse a version whose image already exists
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # A published version is never rebuilt: a re-run would produce another digest under the same tag.
          if out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "::error::${IMAGE}:${VERSION} already exists; ship the next patch version instead."
            exit 1
          fi
          if ! grep -qiE 'not found|manifest unknown|name unknown|no such manifest' <<< "$out"; then
            echo "::error::Could not confirm the tag is free: $out"
            exit 1
          fi

      - name: Build and push (SBOM and provenance attached)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Validate the published digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid digest returned by the build."
            exit 1
          fi
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Print the deploy reference
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo "Deploy reference (verify the attestation before pulling): \`${IMAGE}:${VERSION}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release with notes and image-digest.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Digest missing or invalid."
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
            echo "Release candidate ${TAG}: a rehearsal, not for production." > notes.md
          else
            scripts/release-notes.sh "$VERSION" > notes.md
          fi
          printf '%s\n' "$DIGEST" > image-digest.txt
          gh release create "$TAG" image-digest.txt --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
