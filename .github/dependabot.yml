# Weekly, grouped, never auto-merged (docs/adr/0001-stack.md section 2, docs/contracts/deploy.md section 3).
# Security updates are raised immediately by GitHub regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # TypeScript 7 and @types/node 26 break the build; lift these when the toolchain supports them.
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
      - dependency-name: '@types/node'
        versions: ['>=26.0.0']
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
