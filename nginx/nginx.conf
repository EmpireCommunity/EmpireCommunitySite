# Main nginx configuration of the site image (docs/contracts/routing-locale.md section 6).
# D-20: no access log at the origin; a minimal error log goes to stderr.
worker_processes 1;
error_log /dev/stderr error;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log off;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;

  # The container runs read-only with a tmpfs on /tmp, so every temp path lives there.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # One policy per path family. The support pages carry no Cloudflare analytics hosts.
  map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    "~^/(pt-br|en-us)/support(/|$)" "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
  }

  include /etc/nginx/conf.d/*.conf;
}
