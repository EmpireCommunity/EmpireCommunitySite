# Server block of the site image (docs/contracts/routing-locale.md section 6).
# Header inheritance rule: nginx drops inherited add_header as soon as a location sets its own, so no header is
# set at server level and EVERY location includes snippets/security-headers.conf. A new location without the
# include fails the HTTP header test (scripts/http-test.ts).
server {
  listen 8080;
  server_name _;

  absolute_redirect off;
  port_in_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  gzip_static on;
  error_page 404 /404.html;

  location = /healthz {
    include snippets/limit-methods.conf;
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /_astro/ {
    include snippets/limit-methods.conf;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /data/members.json {
    # The method rule comes first in every location (routing-locale section 6), so POST with a query string is 405.
    include snippets/limit-methods.conf;
    # A query string never reaches the file (members-json 2.9).
    if ($args != "") { return 404; }
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # D-29: the invite page is served directly (200, no redirect, no Cloudflare or nginx rule).
  location = /discord {
    include snippets/limit-methods.conf;
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /discord/index.html =404;
  }

  location / {
    include snippets/limit-methods.conf;
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # A directory URL without the trailing slash is redirected to the slash form (relative, see absolute_redirect).
    try_files $uri $uri/ =404;
  }
}
